        <script type="application/javascript">
        var groupcount = 0;
        var count = 0;
        var groups;

        function onLoad() {
            var groups_serialized = runScript('__zdb_parse4024()');
            alert('serialized: ' + groups_serialized)
            groups = __zdb_deserialize_recursive(groups_serialized);
            alert(groups[0]);
            if (groups === null || groups === undefined) {
                groups = [];
            }
            alert('groups length:' + groups.length);
            groupcount = groups.length;
            if (groupcount === 0) {
                add(1);
            } else {
                add(groupcount);
                insert();
            }
            return true;
        }

        function onAccept() {
            runScript_afterCloseDialog('__zdb_paste4024');
        }

        function onCancel() {
            return true;
        }

        function insert() {
            var gint;
            for (var g in groups) {
                for (var i in groups[g]) {
                    gint = parseInt(g, 10) + 1;
                    alert(gint);
                    document.getElementById(i + "" + gint).value = groups[g][i];
                }
            }
            return true;
        }

        function add(howmany) {
            var protob = document.getElementById('protob');
            var protoe = document.getElementById('protoe');
            var beginClone, endClone;
            var container = document.getElementById('container');
            for (var x = 1; x <= howmany; x++) {
                count++;
                // Create group container
                var groupbox = document.createElement('div');
                groupbox.setAttribute('id', 'g' + count);
                groupbox.style.border = "1px solid #aaa";
                groupbox.style.padding = "0.5em";
                groupbox.style.marginBottom = "1em";

                var caption = document.createElement('div');
                caption.setAttribute('class', 'caption');
                caption.textContent = count + '. Gruppe';
                groupbox.appendChild(caption);
                container.appendChild(groupbox);

                beginClone = protob.cloneNode(true);
                beginClone.setAttribute('id', 'b' + count);
                beginClone.style.display = "block";
                groupbox.appendChild(beginClone);

                // Set IDs on individual input elements in the beginning block.
                var bdElems = beginClone.querySelectorAll('.bd, .bb, .bj, .bh, .bm, .bt');
                for (var i = 0; i < bdElems.length; i++) {
                    var el = bdElems[i];
                    var className = el.getAttribute('class');
                    el.setAttribute('id', className + count);
                    if (className === "bd") {
                        el.textContent = "Beginn";
                    }
                }

                endClone = protoe.cloneNode(true);
                endClone.setAttribute('id', 'e' + count);
                endClone.style.display = "block";
                groupbox.appendChild(endClone);

                // Set IDs on individual input elements in the end block.
                var edElems = endClone.querySelectorAll('.ed, .eb, .ej, .eh, .em, .et');
                for (var i = 0; i < edElems.length; i++) {
                    var el = edElems[i];
                    var className = el.getAttribute('class');
                    el.setAttribute('id', className + count);
                    if (className === "ed") {
                        el.textContent = "Ende";
                    }
                }
            }
            // Set focus to first group's bb textbox
            var firstBB = document.getElementById('bb1');
            if (firstBB) firstBB.focus();
            return true;
        }
