<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EZB-Account definieren</title>
    <link rel="stylesheet" type="text/css" href="./W4DialogStyle.css" />
    <link rel="stylesheet" type="text/css" href="./ZDBStyle.css" />
    <script src="./W4DialogFunctions.js"></script>
    <script type="application/javascript">
        const getBibId = async () => {
            try {
                const val = await getProfileString("zdb", "ezb.account", "");
                document.getElementById("ezbBibIdInput").value = val;
                return true;
            } catch (e) {
                alert('Fehler beim Laden der Einstellungen: ' + e.message);
            }
        };
        const saveBibId = async () => {
            try {
                var bibid_input = document.getElementById("ezbBibIdInput").value;
                if (bibid_input.length > 0) {
                    await writeProfileString("zdb", "ezb.account", bibid_input);
                    closeDialog();
                } else {
                    await writeProfileString("zdb", "ezb.account", "");
                    closeDialog();
                }
            } catch (e) {
                alert('Fehler beim Speichern: ' + e.message);
            }
        };
        setTimeout(() =>  getBibId(), 400);
    </script>
</head>

<body>
    <h2>EZB-Account definieren</h2>
    <p>Bitte geben Sie die BibID Ihres EZB-Accounts ein (Beispiel: ZBMED). Diese Angabe wird bei Verwendung des Skripts "ZDB_EZB" mit dem URL an die EZB übergeben.</p>
    <p>Leere Eingabe und "OK" löscht die gespeicherte BibID.</p>

    <form id="EZBAccountDefinierenForm">
        <div class="form-group">
            <div class="form-cell"> 
        <label for="ezbBibIdInput">BibID eingeben:</label>
        <input type="text" id="ezbBibIdInput" name="ezbBibIdInput" size="40" />
            </div>
        </div>
        <div>
        <button type="submit" onclick="saveBibId();">OK</button>
        <button type="button" onclick="closeDialog();">Abbrechen</button>
        </div>
    </form>
</body>
</html>
