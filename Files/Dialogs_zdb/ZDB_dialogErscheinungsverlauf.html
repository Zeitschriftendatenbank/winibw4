<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <title>Erscheinungsverlauf</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" type="text/css" href="./ZDBStyle.css" />
    <script src="./W4DialogFunctions.js"></script>
    <script src="./ZDB_DialogFunctions.js"></script>
    <style>
        body {
            font-family: system-ui, sans-serif;
            margin: 2em;
            overflow: auto;
        }

        .dialog {
            border: 1px solid #ccc;
            padding: 1em;
            border-radius: 4px;
        }

        .groupbox {
            border: 1px solid #aaa;
            padding: 1em;
            margin-bottom: 1em;
            border-radius: 4px;

        }

        .caption {
            font-weight: bold;
            margin-bottom: 0.5em;
        }

        .form-group {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5em 3em;
            align-items: stretch;
            margin-bottom: 1.5em;
        }

        .form-cell {
            display: flex;
            align-items: center;
            min-width: 14em;
            margin: 0.2em 0;
        }

        .form-cell label {
            min-width: 10em;
            margin-right: 0.5em;
            margin-left: 1.5em;
        }

        input[type="text"],
        select {
            width: 10em;
            box-sizing: border-box;
        }

        .button-group {
            margin-top: 2em;
            text-align: right;
        }

        button {
            padding: 0.5em 1em;
            margin-left: 0.5em;
            border: none;
            border-radius: 4px;
            background: #0066cc;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #0052a3;
        }

        .cancel {
            background: #666;
        }

        .cancel:hover {
            background: #555;
        }

        .laufend-box {
            margin-top: 1em;
            text-align: right;
        }
    </style>
</head>

<body>
    <form id="erscheinungsverlaufForm" onsubmit="onAccept(event); return false;">
        <input type="hidden" name="count" id="count" value="" />
        <div class="dialog">
            <div id="groups"></div>
            <div class="laufend-box">
                <label for="lfd" style="font-weight:bold;">laufend</label>
                <input type="checkbox" id="lfd">
            </div>
            <div class="button-group">
                <button type="button" onclick="addGroup();">weitere Gruppe hinzufügen</button>
                <button type="button" onclick="onCancel();" class="cancel">Abbrechen</button>
                <button type="submit">OK</button>
            </div>
        </div>
    </form>
    <script type="application/javascript">
        var groupcount = 0;
        var    groupIndex = 0;
        var    count = 0;
        const    groups = [];
        var  feld4024 = '';


        const createGroupBox = (idx) => {
            const group = document.createElement('div');
            group.className = 'groupbox';
            group.innerHTML =
                '<div class="caption">' + (idx + 1) + '. Gruppe</div>' +
                '<div class="form-group">' +
                '<div class="form-cell"><label for="bb' + idx + '">Bandzählung:</label><input type="text" name="bb' + idx + '" id="bb' + idx + '" /></div>' +
                '<div class="form-cell"><label for="bj' + idx + '">Jahr:</label><input type="text" name="bj' + idx + '" id="bj' + idx + '" /></div>' +
                '<div class="form-cell"><label for="bh' + idx + '">Heft:</label><input type="text" name="bh' + idx + '" id="bh' + idx + '" /></div>' +
                '<div class="form-cell"><label for="bm' + idx + '">Monat:</label><select name="bm' + idx + '" id="bm' + idx + '">' +
                '<option value=""></option>' +
                Array.apply(null, { length: 12 }).map(function (_, i) { return '<option value="' + (i + 1) + '">' + (i + 1) + '</option>'; }).join('') +
                '</select></div>' +
                '<div class="form-cell"><label for="bt' + idx + '">Tag:</label><select name="bt' + idx + '" id="bt' + idx + '">' +
                '<option value=""></option>' +
                Array.apply(null, { length: 31 }).map(function (_, i) { return '<option value="' + (i + 1) + '">' + (i + 1) + '</option>'; }).join('') +
                '</select></div>' +
                '</div>' +
                '<div class="form-group">' +
                '<div class="form-cell"><label for="eb' + idx + '">Bandzählung (Ende):</label><input type="text" name="eb' + idx + '" id="eb' + idx + '" /></div>' +
                '<div class="form-cell"><label for="ej' + idx + '">Jahr (Ende):</label><input type="text" name="ej' + idx + '" id="ej' + idx + '" /></div>' +
                '<div class="form-cell"><label for="eh' + idx + '">Heft (Ende):</label><input type="text" name="eh' + idx + '" id="eh' + idx + '" /></div>' +
                '<div class="form-cell"><label for="em' + idx + '">Monat (Ende):</label><select name="em' + idx + '" id="em' + idx + '">' +
                '<option value=""></option>' +
                Array.apply(null, { length: 12 }).map(function (_, i) { return '<option value="' + (i + 1) + '">' + (i + 1) + '</option>'; }).join('') +
                '</select></div>' +
                '<div class="form-cell"><label for="et' + idx + '">Tag (Ende):</label><select name="et' + idx + '" id="et' + idx + '">' +
                '<option value=""></option>' +
                Array.apply(null, { length: 31 }).map(function (_, i) { return '<option value="' + (i + 1) + '">' + (i + 1) + '</option>'; }).join('') +
                '</select></div>' +
                '</div>';
            return group;
        }

        const addGroup = () => {
            const groupsDiv = document.getElementById('groups');
            groupsDiv.appendChild(createGroupBox(groupIndex));
            groupIndex++;
        }

        const onLoad = async () => {
            try {
                feld4024 = await runScript('__zdbGet4024()');
                if ('' === feld4024) {
                    closeDialog();
                    return;
                }
                parse4024();

                const groupcount = groups.length;
                if (groupcount === 0) {
                    addGroup();
                } else {
                    for (let i = 0; i < groupcount; i++) {
                        addGroup();
                    }
                    insert();
                }
                return true;
            } catch (error) {
                alert('Error loading dialog: ' + (error && error.message ? error.message : String(error)));
            }
        };

        const onAccept = async (evt) => {
            if (evt && typeof evt.preventDefault === 'function') evt.preventDefault();
            try {
                document.getElementById('count').value = groupIndex - 1;
                await runScript('__zdb_paste4024');
                closeDialog();
            } catch (error) {
                alert('Error on accept: ' + (error && error.message ? error.message : String(error)));
            }
        };

        const onCancel = () => {
            closeDialog();
        }

        const parse4024 = () => {
            //alert(feld4024);
            if (!feld4024) {
                return;
            }
            //alert('zdb_parse4024');
            //__zeigeEigenschaften(o);
            //alert('test serialize: ' + __zdb_serialize_recursive([{ bj: '1995' }]));
            let split4024, bb, bj, bh, bm, bt, eb, ej, eh, em, et, group, splitter;
            const getChained = (chain, splitter, where) => {
                //alert('getChained: ' + chain);
                let split;
                if (splitter.test(chain)) {
                    split = chain.split('/');
                    return ('b' === where) ? split[0] : split[split.length - 1];
                } else {
                    return chain;
                }
            }
            if ("-" === feld4024.substr(feld4024.length - 1)) {
                document.getElementById('lfd').checked = true;
            }
            split4024 = feld4024.split('$0;');
            splitter = /\$/;
            for (let s in split4024) {
                if (!split4024.hasOwnProperty(s)) {
                    continue;
                }
                group = {};
                if (bb = split4024[s].match(/\$d([^\$]+)/)) {
                    group['bb'] = getChained(bb[1], splitter, 'b');
                }
                if (bj = split4024[s].match(/\$j([^\$]+)/)) {
                    group['bj'] = getChained(bj[1], splitter, 'b');
                }
                if (bh = split4024[s].match(/\$e([^\$]+)/)) {
                    group['bh'] = getChained(bh[1], splitter, 'b');
                }
                if (bm = split4024[s].match(/\$c([^\$]+)/)) {
                    group['bm'] = getChained(bm[1], splitter, 'b');
                }
                if (bt = split4024[s].match(/\$b([^\$]+)/)) {
                    group['bt'] = getChained(bt[1], splitter, 'b');
                }
                if (eb = split4024[s].match(/\$n([^\$]+)/)) {
                    group['eb'] = getChained(eb[1], splitter, 'e');
                }
                if (ej = split4024[s].match(/\$k([^\$]+)/)) {
                    group['ej'] = getChained(ej[1], splitter, 'e');
                    if (2 === group['ej'].length) {
                        group['ej'] = ej[1].substr(0, 2) + group['ej'];
                    }
                }
                if (eh = split4024[s].match(/\$o([^\$]+)/)) {
                    group['eh'] = getChained(eh[1], splitter, 'e');
                }
                if (em = split4024[s].match(/\$m([^\$]+)/)) {
                    group['em'] = getChained(em[1], splitter, 'e');
                }
                if (et = split4024[s].match(/\$l([^\$]+)/)) {
                    group['et'] = getChained(et[1], splitter, 'e');
                }
                //__zeigeEigenschaften(group);
                groups.push(group);
            }
            //alert('groups length:' + groups.length);
            //alert('Gesammelt:\n' + JSON.stringify({ gruppen: groups }, null, 2));
            //activeWindow.clipboard = __zdb_serialize_recursive(groups);
        }


        const insert = () => {
            let gint;
            for (let g in groups) {
                for (let i in groups[g]) {
                    //gint = parseInt(g, 10) + 1;
                    gint = parseInt(g, 10);
                    //alert('Get Name ' + i + "" + gint);
                    document.getElementById(i + "" + gint).value = groups[g][i];
                }
            }
            return true;
        }
        // Initialize the dialog on page load
        setTimeout(() => onLoad(), 400);
        //document.addEventListener("DOMContentLoaded", onLoad);
        //onLoad();
        //]]>
    </script>
</body>

</html>
