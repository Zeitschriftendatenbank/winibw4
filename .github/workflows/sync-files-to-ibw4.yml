# Workflow for syncing script files to cKlee/IBW4 repository
# Syncs Scripts/zdb/ and Scripts/isil/ subdirectories
name: Sync Files to IBW4

on:
  push:
    branches:
      - dev
    paths:
      - 'Scripts/**'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4

      - name: Sync Scripts directory to IBW4 repository
        uses: cpina/github-action-push-to-another-repository@v1.7.2
        env:
          SSH_DEPLOY_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
        with:
          source-directory: 'Scripts'
          destination-github-username: 'cKlee'
          destination-repository-name: 'IBW4'
          target-branch: main
          target-directory: 'Scripts'
          commit-message: 'Sync scripts from winibw4'
